id = "tekken5dr"
name = "Tekken 5: Dark Resurrection"
main = "app.wasm"

[modes.versus]
sim = "gameplay.wasm"
presenter = "gamerender.wasm"

[params.stage]
kind = "text"
default = "dragons_nest"
expose = true

[params.start_health]
kind = "number"
default = 180
min = 1
max = 999
expose = true

[params.damage_percent]
kind = "number"
default = 100
min = 0
max = 1000
expose = true

[params.pushback_percent]
kind = "number"
default = 100
min = 0
max = 1000
expose = true

[params.rounds_to_win]  # ft3, ft7, ...
kind = "number"
default = 2
min = 1
max = 10
expose = true

[params.round_time]  # seconds; 0 = no clock
kind = "number"
default = 60
min = 0
max = 99
expose = true
